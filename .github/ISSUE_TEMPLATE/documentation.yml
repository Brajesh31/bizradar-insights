name: "📚 Documentation correction"
description: "Report a missing, unclear or inaccurate guide."
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Document or section
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is missing or inaccurate?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction
