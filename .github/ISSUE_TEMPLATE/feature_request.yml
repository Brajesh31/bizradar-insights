name: "💡 Feature proposal"
description: "Propose a product or engineering improvement."
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and evidence
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data source, analytics or schema impact
  - type: textarea
    id: security
    attributes:
      label: Security, privacy and access-control impact
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility considerations
  - type: textarea
    id: tests
    attributes:
      label: Verification plan
