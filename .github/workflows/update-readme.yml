name: README documentation checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify README sections and assets
        run: |
          test -s README.md
          grep -q "mermaid" README.md
          grep -q "SECURITY.md" README.md
          grep -q "Data sources" README.md
          test -s docs/README.md
          test -s assets/diagrams/product-journey.svg
          test -s assets/diagrams/system-architecture.svg
          test -s assets/diagrams/analysis-pipeline.svg
          echo "README documentation entry points are present."
